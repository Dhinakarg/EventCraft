name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pip-audit Dependency Vulnerability Scan
        run: pip-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Cyclomatic Complexity Check (C901)
        run: ruff check --select C901 app

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Strict Mypy Type Check
        run: mypy --strict app

      - name: Run Pylint Check
        run: pylint app

      - name: Run Radon Complexity Gate (Grade A only)
        run: |
          radon cc app -n B
          radon mi app -n B

      - name: Run ESLint Frontend Check
        run: npx eslint static tests/js

      - name: Run Frontend JavaScript Unit Tests
        run: node --test tests/js/*.test.js

      - name: Run Pytest with Whole-App Coverage Enforcement (>=90%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90
