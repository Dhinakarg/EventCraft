[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eventcraft-ai"
version = "1.0.0"
description = "Accessible, deterministic hybrid event planning engine with Google Gemini AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EventCraft Team" }]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90", "UP", "N", "SIM", "D", "ANN", "S"]
ignore = [
    "B008",    # FastAPI depends on function calls in parameter defaults (Query, Depends)
    "D104",    # Package __init__.py docstrings
    "D203",    # Incompatible with D211 (one blank line before class docstring)
    "D213",    # Incompatible with D212 (multi-line docstring summary start)
    "ANN401",  # Dynamically typed expressions (Any) used where legitimately required
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "D"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
